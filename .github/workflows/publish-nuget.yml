name: Publish NuGet package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Determine package version
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag non valido: $TAG"
            exit 1
          fi
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Restore
        run: >
          dotnet restore FDR11.Logger.slnx
          --source https://api.nuget.org/v3/index.json

      - name: Build
        run: >
          dotnet build FDR11.Logger.slnx
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test FDR11.Logger.slnx
          --configuration Release
          --no-build
          --no-restore

      - name: Pack nupkg and snupkg
        run: >
          dotnet pack Code/FDR11.Logger.csproj
          --configuration Release
          --no-build
          --output artifacts
          -p:PackageVersion=${{ env.PACKAGE_VERSION }}
          -p:RepositoryUrl=${{ github.server_url }}/${{ github.repository }}
          -p:RepositoryCommit=${{ env.SOURCE_COMMIT }}
          -p:CI=true

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FDR11.Logger-${{ env.PACKAGE_VERSION }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      - name: Publish to GitHub Packages
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet nuget push
          "artifacts/FDR11.Logger.${{ env.PACKAGE_VERSION }}.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "$NUGET_AUTH_TOKEN"
          --no-symbols
          --skip-duplicate

      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push
          "artifacts/FDR11.Logger.${{ env.PACKAGE_VERSION }}.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "$NUGET_API_KEY"
          --no-symbols
          --skip-duplicate

      - name: Publish symbols to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push
          "artifacts/FDR11.Logger.${{ env.PACKAGE_VERSION }}.snupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "$NUGET_API_KEY"
          --skip-duplicate

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              artifacts/*.nupkg artifacts/*.snupkg --clobber
          else
            gh release create "$RELEASE_TAG" \
              artifacts/*.nupkg artifacts/*.snupkg \
              --verify-tag \
              --generate-notes \
              --title "FDR11.Logger $PACKAGE_VERSION"
          fi
